# Apache 2.4 virtual hosts. See docs/reverse-proxies.md.
# Requires ssl, proxy, proxy_http, headers, and alias modules.
# The server's main configuration must listen on ports 80 and 443.
<VirtualHost *:80>
	ServerName board.example.org
	Redirect 308 / https://board.example.org/
</VirtualHost>

<VirtualHost *:443>
	ServerName board.example.org
	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/board.example.org/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/board.example.org/privkey.pem
	SSLProtocol -all +TLSv1.2 +TLSv1.3

	ProxyRequests Off
	ProxyPreserveHost On
	ProxyAddHeaders Off
	# Replace incoming values before forwarding to the loopback application.
	RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
	RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Forwarded-Host "expr=%{HTTP_HOST}"
	RequestHeader unset Forwarded
	# Entire request, including multipart overhead: 64 MiB.
	LimitRequestBody 67108864
	ProxyTimeout 300
	ProxyPass / http://127.0.0.1:8082/ connectiontimeout=5 timeout=300
	ProxyPassReverse / http://127.0.0.1:8082/
</VirtualHost>
